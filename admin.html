<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | ExamPortal</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="wrap">
    <h1>Admin Control Panel</h1>
    <div class="grid">
      <div class="card"><div class="muted">REGISTERED USERS</div><div id="s-users" class="stat"></div></div>
      <div class="card"><div class="muted">ACTIVE COURSES</div><div id="s-courses" class="stat"></div></div>
    </div>

    <div class="tabs">
      <button data-tab="users" class="active" onclick="tab('users')">User Accounts</button>
      <button data-tab="subjects" onclick="tab('subjects')">Subjects</button>
      <button data-tab="assign" onclick="tab('assign')">Faculty Assignments</button>
      <button data-tab="proctor" onclick="tab('proctor')">Live Proctoring</button>
      <button data-tab="analytics" onclick="tab('analytics')">Analytics</button>
    </div>

    <!-- User accounts: directory table + a form that's hidden until Add/Edit is clicked -->
    <section id="users" class="pane stack active">
      <div id="user-form" class="card stack hidden">
        <h3 id="uf-title" style="margin:0"></h3>
        <div class="grid">
          <div><label>Full Name</label><input id="uf-name"></div>
          <div><label>Username</label><input id="uf-username"></div>
          <div><label>Password</label><input id="uf-password" type="text" autocomplete="off"></div>
          <div><label>Role</label>
            <select id="uf-role">
              <option value="student">Student</option>
              <option value="faculty">Faculty</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
        <p id="uf-err" class="err hidden"></p>
        <div class="row">
          <button class="btn ghost" onclick="closeForm()">Cancel</button>
          <button class="btn ok" onclick="saveUser()">Save Account</button>
        </div>
      </div>

      <div class="card">
        <div class="row"><h3 style="margin:0">User Directory</h3><button class="btn" onclick="openForm()">+ Add User</button></div>
        <table>
          <thead><tr><th>Name</th><th>Username</th><th>Role</th><th></th></tr></thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Subjects: same add/edit-form pattern as above, but for subjects -->
    <section id="subjects" class="pane stack">
      <div id="subject-form" class="card stack hidden">
        <h3 id="sf-title" style="margin:0"></h3>
        <div class="grid">
          <div><label>Course Code</label><input id="sf-code" placeholder="e.g. CS101"></div>
          <div><label>Course Title</label><input id="sf-name" placeholder="e.g. Introduction to Computer Science"></div>
        </div>
        <div><label>Description</label><textarea id="sf-desc" rows="3"></textarea></div>
        <div>
          <label>Assigned Faculty</label>
          <div id="sf-faculty" class="grid" style="gap:4px"></div>
        </div>
        <p id="sf-err" class="err hidden"></p>
        <div class="row">
          <button class="btn ghost" onclick="closeSubject()">Cancel</button>
          <button class="btn ok" onclick="saveSubject()">Save Subject</button>
        </div>
      </div>

      <div class="card">
        <div class="row"><h3 style="margin:0">Subject List</h3><button class="btn" onclick="openSubject()">+ Add Subject</button></div>
        <table>
          <thead><tr><th>Code</th><th>Title</th><th>Faculty</th><th>Students</th><th>Exams</th><th></th></tr></thead>
          <tbody id="subj-body"></tbody>
        </table>
      </div>
    </section>

    <!-- Faculty assignments: lets more than one faculty member teach the same subject -->
    <section id="assign" class="pane card">
      <table>
        <thead><tr><th>Code</th><th>Course</th><th>Assigned Faculty</th><th style="text-align:right">Add Faculty</th></tr></thead>
        <tbody id="assign-body"></tbody>
      </table>
    </section>

    <!-- Proctoring (placeholder video feeds) -->
    <section id="proctor" class="pane grid"></section>

    <!-- Analytics -->
    <section id="analytics" class="pane grid">
      <div class="card"><div class="muted">AVERAGE PASS RATE</div><div id="a-pass" class="stat"></div></div>
      <div class="card"><div class="muted">TOTAL ATTEMPTS</div><div id="a-total" class="stat"></div></div>
    </section>
  </div>

  <script src="data.js"></script>
  <script>
    const user = requireRole('admin');
    const db = DB.load();
    renderNav(user, [['admin.html', 'Control Panel'], ['assign.html', 'Assign Subjects']]);

    let editingId = null;   // id of the user account being edited (null = adding a new one)
    let subEditing = null;  // id of the subject being edited (null = adding a new one)

    /* ---------- Draws every tab's content ---------- */
    function draw() {
      $('s-users').textContent = db.users.length;
      $('s-courses').textContent = db.subjects.length;

      /* Users tab */
      $('users-body').innerHTML = db.users.map(u => `<tr>
        <td>${esc(u.name)}</td>
        <td>${esc(u.username)}</td>
        <td><span class="badge">${u.role}</span></td>
        <td><div class="actions" style="justify-content:flex-end">
          <button class="btn sm" onclick="openForm(${u.id})">Edit</button>
          <button class="btn ghost sm" onclick="delUser(${u.id})">Remove</button>
        </div></td>
      </tr>`).join('');

      /* Subjects tab */
      $('subj-body').innerHTML = db.subjects.map(s => `<tr>
        <td><b>${esc(s.code)}</b></td>
        <td>${esc(s.name)}<div class="muted">${esc(s.description || '')}</div></td>
        <td>${s.facultyIds.length}</td>
        <td>${s.studentIds.length}</td>
        <td>${db.exams.filter(e => e.subjectId === s.id).length}</td>
        <td><div class="actions" style="justify-content:flex-end">
          <button class="btn sm" onclick="openSubject(${s.id})">Edit</button>
          <button class="btn danger sm" onclick="delSubject(${s.id})">Delete</button>
        </div></td>
      </tr>`).join('') || '<tr><td colspan="6" class="muted">No subjects yet.</td></tr>';

      /* Faculty assignments tab: each subject shows its current faculty as removable
         chips, plus a dropdown of faculty not yet assigned to add more */
      $('assign-body').innerHTML = db.subjects.map(s => {
        const assigned = s.facultyIds.map(id => db.users.find(u => u.id === id)).filter(Boolean);
        const free = db.users.filter(u => u.role === 'faculty' && !s.facultyIds.includes(u.id));
        return `<tr>
          <td><b>${s.code}</b></td>
          <td>${esc(s.name)}</td>
          <td><div class="chips">
            ${assigned.map(f => `<span class="chip">${esc(f.name)}<button title="Remove" onclick="removeFaculty(${s.id},${f.id})">×</button></span>`).join('') || '<span class="muted">Unassigned</span>'}
          </div></td>
          <td>${free.length
            ? `<div class="actions" style="justify-content:flex-end">
                <select id="add-fac-${s.id}" class="inline">${free.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select>
                <button class="btn sm" onclick="addFaculty(${s.id})">Add</button>
              </div>`
            : '<div class="muted" style="text-align:right">All faculty assigned</div>'}</td>
        </tr>`;
      }).join('');

      /* Proctoring tab (placeholder: a card per student, no real video) */
      $('proctor').innerHTML = db.users.filter(u => u.role === 'student').map(s =>
        `<div class="feed"><div class="row"><b>${esc(s.name)}</b><span class="badge" style="background:#10b981">LIVE</span></div>
        <div>AI Confidence: 99.4%</div></div>`).join('');

      /* Analytics tab */
      const passed = db.attempts.filter(a => a.status === 'Passed').length;
      $('a-pass').textContent = db.attempts.length ? Math.round(passed / db.attempts.length * 100) + '%' : 'N/A';
      $('a-total').textContent = db.attempts.length;
    }

    /* ==========================================================
       USER ACCOUNTS (add / edit / delete)
       ========================================================== */

    // Opens the user form. Pass an id to edit that user, or nothing to add a new one.
    function openForm(id) {
      editingId = id ?? null;
      const u = editingId !== null ? db.users.find(x => x.id === editingId) : null;

      $('uf-title').textContent = u ? `Edit Account: ${u.name}` : 'Add New User';
      $('uf-name').value = u ? u.name : '';
      $('uf-username').value = u ? u.username : '';
      $('uf-password').value = ''; // never pre-fill the password field
      $('uf-password').placeholder = u ? 'Leave blank to keep current password' : 'Required';
      $('uf-role').value = u ? u.role : 'student';
      $('uf-err').classList.add('hidden');

      $('user-form').classList.remove('hidden');
      tab('users');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeForm() {
      $('user-form').classList.add('hidden');
      editingId = null;
    }

    function saveUser() {
      const name = $('uf-name').value.trim();
      const username = $('uf-username').value.trim();
      const password = $('uf-password').value;
      const role = $('uf-role').value;
      const fail = m => { $('uf-err').textContent = m; $('uf-err').classList.remove('hidden'); };

      if (!name || !username) return fail('Name and username are required.');
      if (db.users.some(u => u.username === username && u.id !== editingId)) return fail('That username is already taken.');
      if (editingId === null && !password) return fail('A password is required for new accounts.');
      if (password && password.length < 4) return fail('Password must be at least 4 characters.');

      if (editingId === null) {
        // Adding a new account
        db.users.push({ id: Date.now(), username, password, role, name });
      } else {
        // Editing an existing account
        const u = db.users.find(x => x.id === editingId);
        if (u.id === user.id && role !== 'admin') return fail('You cannot change your own role.'); // stop locking yourself out

        Object.assign(u, { name, username, role });
        if (password) u.password = password; // blank password = keep the old one
        if (u.id === user.id) Session.set(u); // keep the logged-in session in sync if editing yourself

        // If the role changed away from faculty/student, clean up subject assignments that no longer make sense
        if (role !== 'faculty') db.subjects.forEach(s => s.facultyIds = s.facultyIds.filter(f => f !== u.id));
        if (role !== 'student') db.subjects.forEach(s => s.studentIds = s.studentIds.filter(x => x !== u.id));
      }

      DB.save(db);
      closeForm();
      draw();
    }

    function delUser(id) {
      if (id === user.id) return alert('Cannot delete the logged-in admin account.');
      if (!confirm('Remove this account?')) return;

      db.users = db.users.filter(u => u.id !== id);
      db.subjects.forEach(s => {
        s.facultyIds = s.facultyIds.filter(f => f !== id);
        s.studentIds = s.studentIds.filter(x => x !== id);
      });
      db.retakes = db.retakes.filter(r => r.studentId !== id);
      DB.save(db);
      draw();
    }

    /* ==========================================================
       SUBJECTS (add / edit / delete)
       ========================================================== */

    function openSubject(id) {
      subEditing = id ?? null;
      const s = subEditing !== null ? db.subjects.find(x => x.id === subEditing) : null;

      $('sf-title').textContent = s ? `Edit Subject: ${s.code}` : 'Add New Subject';
      $('sf-code').value = s ? s.code : '';
      $('sf-name').value = s ? s.name : '';
      $('sf-desc').value = s ? (s.description || '') : '';

      // One checkbox per faculty account, pre-checked if they're already assigned
      $('sf-faculty').innerHTML = db.users.filter(u => u.role === 'faculty').map(f => `
        <label class="agree"><input type="checkbox" value="${f.id}" ${s && s.facultyIds.includes(f.id) ? 'checked' : ''}>${esc(f.name)}</label>`).join('')
        || '<span class="muted">No faculty accounts yet.</span>';
      $('sf-err').classList.add('hidden');

      $('subject-form').classList.remove('hidden');
      tab('subjects');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeSubject() {
      $('subject-form').classList.add('hidden');
      subEditing = null;
    }

    function saveSubject() {
      const code = $('sf-code').value.trim().toUpperCase();
      const name = $('sf-name').value.trim();
      const description = $('sf-desc').value.trim();
      const facultyIds = [...document.querySelectorAll('#sf-faculty input:checked')].map(x => +x.value);
      const fail = m => { $('sf-err').textContent = m; $('sf-err').classList.remove('hidden'); };

      if (!code || !name) return fail('Course code and title are required.');
      if (db.subjects.some(s => s.code === code && s.id !== subEditing)) return fail('That course code already exists.');

      if (subEditing === null) {
        // New subject starts with no enrolled students
        db.subjects.push({ id: Date.now(), code, name, description, facultyIds, studentIds: [] });
      } else {
        Object.assign(db.subjects.find(s => s.id === subEditing), { code, name, description, facultyIds });
      }

      DB.save(db);
      closeSubject();
      draw();
    }

    function delSubject(id) {
      const s = db.subjects.find(x => x.id === id);
      const examIds = db.exams.filter(e => e.subjectId === id).map(e => e.id);
      const attemptCount = db.attempts.filter(a => examIds.includes(a.examId)).length;

      if (!confirm(`Delete ${s.code} - ${s.name}?\n\nThis also removes ${examIds.length} exam(s), ${attemptCount} student attempt(s) and their retake permissions. This cannot be undone.`)) return;

      // Delete the subject AND everything that depends on it
      db.subjects = db.subjects.filter(x => x.id !== id);
      db.exams = db.exams.filter(e => e.subjectId !== id);
      db.attempts = db.attempts.filter(a => !examIds.includes(a.examId));
      db.retakes = db.retakes.filter(r => !examIds.includes(r.examId));
      DB.save(db);
      draw();
    }

    /* ==========================================================
       FACULTY ASSIGNMENTS (several faculty per subject)
       ========================================================== */

    function addFaculty(subId) {
      const fid = +$(`add-fac-${subId}`).value;
      const sub = db.subjects.find(s => s.id === subId);
      if (!fid || sub.facultyIds.includes(fid)) return;
      sub.facultyIds.push(fid);
      DB.save(db);
      draw();
    }

    function removeFaculty(subId, fid) {
      const sub = db.subjects.find(s => s.id === subId);
      sub.facultyIds = sub.facultyIds.filter(f => f !== fid);
      DB.save(db);
      draw();
    }

    draw();
  </script>
</body>
</html>
