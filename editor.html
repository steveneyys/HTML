<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Editor | ExamPortal</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <div class="wrap">
    <a class="btn ghost" href="faculty.html">
      &larr; Back to Dashboard
    </a>

    <h1>Exam Editor</h1>
    <section id="editor"></section>
  </div>

  <script src="data.js"></script>

  <script>
    const user = requireRole('faculty');
    const db = DB.load();

    renderNav(user, [
      ['faculty.html', 'Dashboard'],
      ['assign.html', 'Assign Subjects']
    ]);

    const mySubjects = () =>
      db.subjects.filter(s => s.facultyIds.includes(user.id));

    const params = new URLSearchParams(location.search);
    const isNew = params.get('new') === '1';

    let ed = null;
    let qi = 0;

    /* ---------- Load the exam ---------- */

    if (isNew) {
      const subjects = mySubjects();

      if (!subjects.length) {
        alert('You have no assigned subjects.');
        location.href = 'faculty.html';
        throw new Error('no subjects');
      }

      ed = {
        id: Date.now(),
        subjectId: subjects[0].id,
        title: 'New Exam',
        duration: 30,
        passingGrade: 60,
        maxAttempts: 1,
        shuffle: false,
        allowReview: true,
        password: '',
        questionCount: 0,
        questions: [
          Q.make('mcq', 'Sample Question 1?')
        ]
      };
    } else {
      const found = db.exams.find(exam =>
        exam.id == params.get('id')
      );

      if (
        !found ||
        !mySubjects().some(subject =>
          subject.id === found.subjectId
        )
      ) {
        location.href = 'faculty.html';
        throw new Error('exam not found');
      }

      ed = structuredClone(found);
    }

    /* ---------- Answer fields ---------- */

    function typeEditor(q) {
      if (q.type === 'identification') {
        if (!q.answers?.length) {
          q.answers = [''];
        }

        return `
          <label>Accepted answers</label>

          <p class="muted">
            Enter one accepted answer in each box.
            A student only needs to match one box.
            Answers are not case-sensitive.
            Commas remain part of the answer.
          </p>

          ${q.answers.map((answer, n) => `
            <div style="margin-top:12px">
              <label for="accepted-${n}">
                Accepted answer ${n + 1}
              </label>

              <div class="row" style="flex-wrap:nowrap;gap:8px">
                <input
                  id="accepted-${n}"
                  value="${esc(answer)}"
                  placeholder="Enter one accepted answer"
                  oninput="ed.questions[qi].answers[${n}]=this.value"
                >

                <button
                  type="button"
                  class="btn ghost sm"
                  onclick="removeAcceptedAnswer(${n})"
                  ${q.answers.length === 1 ? 'disabled' : ''}
                  aria-label="Remove accepted answer ${n + 1}"
                >
                  Remove
                </button>
              </div>
            </div>
          `).join('')}

          <button
            type="button"
            class="btn ghost sm"
            style="margin-top:12px"
            onclick="addAcceptedAnswer()"
          >
            + Add accepted answer
          </button>
        `;
      }

      if (q.type === 'dragdrop') {
        return `
          <label>Pairs (item &rarr; correct match)</label>

          ${q.pairs.map((pair, n) => `
            <div class="row"
              style="margin-top:8px;flex-wrap:nowrap">
              <input
                placeholder="Item"
                value="${esc(pair.left)}"
                oninput="ed.questions[qi].pairs[${n}].left=this.value"
              >

              <span>&rarr;</span>

              <input
                placeholder="Match"
                value="${esc(pair.right)}"
                oninput="ed.questions[qi].pairs[${n}].right=this.value"
              >

              <button
                type="button"
                class="btn ghost sm"
                onclick="delPair(${n})"
                aria-label="Remove pair ${n + 1}"
              >
                &times;
              </button>
            </div>
          `).join('')}

          <button
            type="button"
            class="btn ghost sm"
            style="margin-top:10px"
            onclick="addPair()"
          >
            + Add Pair
          </button>
        `;
      }

      const multi = q.type === 'checkbox';

      return `
        <label>
          Options
          (${multi
            ? 'tick every correct answer'
            : 'select the correct one'})
        </label>

        ${q.options.map((option, n) => `
          <div class="row"
            style="margin-top:8px;flex-wrap:nowrap">
            <input
              type="${multi ? 'checkbox' : 'radio'}"
              style="width:auto"
              name="correct-option"
              ${option.isCorrect ? 'checked' : ''}
              aria-label="Mark option ${n + 1} correct"
              onchange="${multi
                ? `toggleCorrect(${n},this.checked)`
                : `setCorrect(${n})`}"
            >

            <input
              value="${esc(option.text)}"
              placeholder="Option ${n + 1}"
              oninput="ed.questions[qi].options[${n}].text=this.value"
            >

            <button
              type="button"
              class="btn ghost sm"
              onclick="delOpt(${n})"
              aria-label="Remove option ${n + 1}"
            >
              &times;
            </button>
          </div>
        `).join('')}

        <button
          type="button"
          class="btn ghost sm"
          style="margin-top:10px"
          onclick="addOpt()"
        >
          + Add Option
        </button>
      `;
    }

    /* ---------- Draw the editor ---------- */

    function drawEditor() {
      const q = ed.questions[qi];

      $('editor').innerHTML = `
        <div class="row" style="margin-bottom:16px">
          <h2 style="margin:0">
            ${esc(ed.title)}
            ${isNew
              ? '<span class="chip warn">Unsaved</span>'
              : ''}
          </h2>

          <div class="actions">
            ${isNew ? '' : `
              <button class="btn danger" onclick="deleteExam()">
                Delete Exam
              </button>
            `}

            <button class="btn ok" onclick="saveExam()">
              Save Exam
            </button>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <label>Exam Title</label>
            <input
              value="${esc(ed.title)}"
              oninput="ed.title=this.value"
            >

            <label>Subject</label>
            <select onchange="ed.subjectId=+this.value">
              ${mySubjects().map(subject => `
                <option
                  value="${subject.id}"
                  ${subject.id === ed.subjectId ? 'selected' : ''}
                >
                  ${esc(subject.code)} - ${esc(subject.name)}
                </option>
              `).join('')}
            </select>

            <label>Duration (minutes)</label>
            <input
              type="number"
              min="1"
              value="${ed.duration}"
              oninput="ed.duration=Math.max(1,+this.value||30)"
            >

            <label>Passing Grade (%)</label>
            <input
              type="number"
              min="1"
              max="100"
              value="${ed.passingGrade || 60}"
              oninput="ed.passingGrade=+this.value||60"
            >

            <label>Attempts Allowed Per Student</label>
            <input
              type="number"
              min="1"
              value="${ed.maxAttempts}"
              oninput="ed.maxAttempts=Math.max(1,+this.value||1)"
            >

            <label for="question-count">
              Number of questions to show
            </label>

            <input
              id="question-count"
              type="number"
              min="0"
              step="1"
              max="${ed.questions.length}"
              value="${ed.questionCount ?? 0}"
              oninput="ed.questionCount=this.value === '' ? NaN : Number(this.value)"
            >

            <p class="muted">
              Question bank: ${ed.questions.length}.
              Enter 0 to show all questions, or
              1–${ed.questions.length} for a random,
              shuffled selection per attempt.
              Different students may still receive some
              of the same questions.
            </p>

            <label>Access Code (optional)</label>
            <input
              value="${esc(ed.password || '')}"
              placeholder="Leave blank for no code"
              autocomplete="off"
              oninput="ed.password=this.value.trim()"
            >

            <label class="agree" style="margin-top:16px">
              <input
                type="checkbox"
                ${ed.shuffle ? 'checked' : ''}
                onchange="ed.shuffle=this.checked"
              >
              Shuffle question order when showing all questions
            </label>

            <label class="agree" style="margin-top:12px">
              <input
                type="checkbox"
                ${ed.allowReview ? 'checked' : ''}
                onchange="ed.allowReview=this.checked"
              >
              Let students review their answers after submitting
            </label>

            <label>Question Bank (${ed.questions.length})</label>

            ${ed.questions.map((question, n) => `
              <button
                class="btn ${n === qi ? '' : 'ghost'}"
                style="width:100%;margin-top:6px;text-align:left"
                onclick="qi=${n};drawEditor()"
              >
                Q${n + 1}. ${esc(question.text.slice(0, 22))}
                <span class="chip" style="float:right">
                  ${Q.types[question.type]}
                </span>
              </button>
            `).join('')}

            <button
              class="btn ghost"
              style="width:100%;margin-top:10px"
              onclick="addQ()"
            >
              + Add Question
            </button>
          </div>

          <div class="card">
            <div class="row">
              <h3>Question ${qi + 1}</h3>

              <button
                class="btn danger sm"
                onclick="delQ()"
              >
                Delete Question
              </button>
            </div>

            <label>Question Type</label>
            <select onchange="setType(this.value)">
              ${Object.entries(Q.types).map(([key, label]) => `
                <option
                  value="${key}"
                  ${q.type === key ? 'selected' : ''}
                >
                  ${label}
                </option>
              `).join('')}
            </select>

            <label>Prompt</label>
            <textarea
              rows="3"
              oninput="ed.questions[qi].text=this.value"
            >${esc(q.text)}</textarea>

            ${typeEditor(q)}
          </div>
        </div>
      `;
    }

    /* ---------- Change question type ---------- */

    function setType(type) {
      const old = ed.questions[qi];

      if (old.type === type) return;

      const next = Q.make(type, old.text);
      next.id = old.id;

      if (
        (type === 'mcq' || type === 'checkbox') &&
        old.options
      ) {
        next.options = old.options.map(option => ({
          ...option
        }));

        const first = Math.max(
          0,
          next.options.findIndex(option => option.isCorrect)
        );

        if (type === 'mcq') {
          next.options.forEach((option, index) => {
            option.isCorrect = index === first;
          });
        } else if (
          !next.options.some(option => option.isCorrect)
        ) {
          next.options[0].isCorrect = true;
        }
      }

      ed.questions[qi] = next;
      drawEditor();
    }

    /* ---------- Accepted-answer boxes ---------- */

    function addAcceptedAnswer() {
      ed.questions[qi].answers.push('');
      drawEditor();

      const last = ed.questions[qi].answers.length - 1;
      $('accepted-' + last).focus();
    }

    function removeAcceptedAnswer(index) {
      if (ed.questions[qi].answers.length <= 1) return;

      ed.questions[qi].answers.splice(index, 1);
      drawEditor();
    }

    /* ---------- Multiple-choice options ---------- */

    function setCorrect(index) {
      ed.questions[qi].options.forEach((option, n) => {
        option.isCorrect = n === index;
      });
    }

    function toggleCorrect(index, checked) {
      ed.questions[qi].options[index].isCorrect = checked;
    }

    function addOpt() {
      ed.questions[qi].options.push({
        id: 'o_' + Date.now(),
        text: 'New Option'
      });

      drawEditor();
    }

    function delOpt(index) {
      if (ed.questions[qi].options.length <= 2) {
        return alert('Questions must have at least 2 options.');
      }

      ed.questions[qi].options.splice(index, 1);
      drawEditor();
    }

    /* ---------- Drag-and-drop pairs ---------- */

    function addPair() {
      ed.questions[qi].pairs.push({
        id: 'p_' + Date.now(),
        left: '',
        right: ''
      });

      drawEditor();
    }

    function delPair(index) {
      if (ed.questions[qi].pairs.length <= 2) {
        return alert('Drag and drop needs at least 2 pairs.');
      }

      ed.questions[qi].pairs.splice(index, 1);
      drawEditor();
    }

    /* ---------- Question bank ---------- */

    function addQ() {
      ed.questions.push(Q.make('mcq'));
      qi = ed.questions.length - 1;
      drawEditor();
    }

    function delQ() {
      if (ed.questions.length <= 1) {
        return alert('Exams must have at least 1 question.');
      }

      ed.questions.splice(qi, 1);
      qi = Math.max(0, qi - 1);
      drawEditor();
    }

    /* ---------- Save exam ---------- */

    function saveExam() {
      if (!ed.title.trim()) {
        return alert('Please enter an exam title.');
      }

      if (!ExamQuestions.valid(ed)) {
        return alert(
          `Enter a whole number from 0 to ${ed.questions.length} ` +
          'for questions to show. Zero means all questions.'
        );
      }

      for (let n = 0; n < ed.questions.length; n++) {
        const question = ed.questions[n];

        if (question.type === 'identification') {
          question.answers = question.answers
            .map(answer => answer.trim())
            .filter(Boolean);
        }

        const problem = Q.problem(question);

        if (problem) {
          qi = n;
          drawEditor();

          return alert(`Question ${n + 1} ${problem}.`);
        }
      }

      const index = db.exams.findIndex(exam =>
        exam.id === ed.id
      );

      if (index === -1) {
        db.exams.push(ed);
      } else {
        db.exams[index] = ed;
      }

      DB.save(db);
      alert('Exam saved.');
      location.href = 'faculty.html';
    }

    /* ---------- Delete exam ---------- */

    function deleteExam() {
      const confirmed = confirm(
        `Delete "${ed.title}"?\n\n` +
        'This also removes its student attempts and retake permissions. ' +
        'This cannot be undone.'
      );

      if (!confirmed) return;

      db.exams = db.exams.filter(exam =>
        exam.id !== ed.id
      );

      db.attempts = db.attempts.filter(attempt =>
        attempt.examId !== ed.id
      );

      db.retakes = db.retakes.filter(retake =>
        retake.examId !== ed.id
      );

      DB.save(db);
      location.href = 'faculty.html';
    }

    drawEditor();
  </script>
</body>
</html>
