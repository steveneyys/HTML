<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Mateo University</title>
  <link rel="icon" href="Logo.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="center card stack">
    <div style="text-align:center">
      <span class="logo-img lg">
        <img src="Logo.png" alt="Mateo University">
      </span>
      <h2>Institutional Exam Portal</h2>
    </div>

    <form id="form">
      <label for="u">Username</label>
      <input
        id="u"
        name="username"
        autocomplete="username"
        required
        placeholder="Enter your username"
      >

      <label for="p">Password</label>
      <input
        id="p"
        name="password"
        type="password"
        autocomplete="current-password"
        required
        placeholder="Enter your password"
      >

      <p id="err" class="err hidden" role="alert"></p>

      <button type="submit" class="btn" style="width:100%;margin-top:16px">
        Sign In
      </button>
    </form>
  </div>

  <script src="data.js"></script>
  <script>
    $('form').onsubmit = async event => {
      event.preventDefault();

      const form = $('form');
      const button = form.querySelector('button[type="submit"]');
      const errorMessage = $('err');

      button.disabled = true;
      button.textContent = 'Signing in…';
      errorMessage.textContent = '';
      errorMessage.classList.add('hidden');

      try {
        const user = await Auth.login(
          $('u').value.trim(),
          $('p').value
        );

        if (!user || !HOME[user.role]) {
          throw new Error('Account role is missing or invalid.');
        }

        Session.set(user);
        location.href = HOME[user.role];
      } catch (error) {
        if (error.name === 'TimeoutError' || error.name === 'AbortError') {
          errorMessage.textContent =
            'Login timed out. Check that the PHP server and database are running, then try again.';
        } else if (error.status === 401) {
          errorMessage.textContent = 'Invalid username or password.';
        } else {
          errorMessage.textContent =
            error.message || 'Could not connect to the login service.';
        }

        errorMessage.classList.remove('hidden');
        button.disabled = false;
        button.textContent = 'Sign In';
      }
    };
  </script>
</body>
</html>
