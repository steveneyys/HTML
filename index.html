<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Mateo University</title>
  <link rel="icon" href="Logo.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="center card stack">
    <div style="text-align:center">
      <span class="logo-img lg">
        <img src="Logo.png" alt="Mateo University">
      </span>
      <h2>Institutional Exam Portal</h2>
    </div>

    <form id="form">
      <label for="u">Username</label>
      <input id="u" required placeholder="Enter your username">

      <label for="p">Password</label>
      <input id="p" type="password" required placeholder="Enter your password">

      <p id="err" class="err hidden"></p>

      <button type="submit" class="btn" style="width:100%;margin-top:16px">
        Sign In
      </button>
    </form>
  </div>

  <script src="data.js"></script>
  <script>
    $('form').onsubmit = e => {
      e.preventDefault();
      DB.load(); // Ensure the initial browser data is copied to the database.
      const user = Auth.login($('u').value.trim(), $('p').value);

      if (!user) {
        $('err').textContent = 'Invalid username or password.';
        $('err').classList.remove('hidden');
        return;
      }

      Session.set(user);
      location.href = HOME[user.role];
    };
  </script>
</body>
</html>
